when:
  - event: ["push"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: microvm
image: nixos

virtualisation:
  docker: true

steps:
  - name: "Build and test"
    command: |
      docker run --rm \
        --volume "$PWD":/workdir \
        --workdir /workdir \
        swift:6.3-noble \
        bash -lc 'swift build && swift test'
